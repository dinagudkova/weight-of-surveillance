version: 2

sources:
  - name: raw
    description: Crawl results loaded by load/load_raw.py (full reload on every run).
    schema: raw
    tables:
      - name: visits
        description: One row per visit (site × consent mode × repeat) as written by crawler/crawl.mjs.
        columns:
          - name: visit_id
            tests: [not_null, unique]
      - name: requests
        description: One row per network request of a visit.
        columns:
          - name: visit_id
            tests: [not_null]
      - name: tcf_visits
        description: >
          Consent-vendor crawl ("promise vs reality"), loaded with load_raw.py --dataset tcf. Same columns as
          visits; tcf_* fields hold the IAB TCF vendor consents after the click. May be absent until that crawl
          is loaded (stg_tcf_visits then returns no rows).
      - name: real_visits
        description: Real-browser crawl (regular Chrome without the automation flag), loaded with load_raw.py --dataset real. Optional.
      - name: real_requests
        description: Requests of the real-browser crawl. Optional.
