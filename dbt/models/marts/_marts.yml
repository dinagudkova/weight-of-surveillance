version: 2

models:
  - name: fct_visits
    description: One row per visit with tracking metrics of the fixed observation window.
    columns:
      - name: visit_id
        tests: [not_null, unique]
      - name: tracking_share_bytes
        description: >
          Share of tracking in the observed page weight: tracking bytes divided by all bytes from page load
          to the end of the 30-second window (phases pre + window). Null for lower-bound visits.
  - name: mart_site_consent_effect
    description: One row per site with tracking in the three consent modes and the available reject option.
    columns:
      - name: site
        tests: [not_null, unique]
      - name: accept_is_lower_bound
        description: The accept visit was stopped because the page flooded the browser with requests; accept values are lower bounds.
      - name: reject_option
        tests:
          - accepted_values:
              arguments:
                values: ["no banner", "reject on first layer", "reject only in settings", "no reject without subscription", "reject not verified"]
  - name: mart_first_tracker
    description: >
      Per usable visit on a site with a banner: milliseconds from the consent click to the first tracking,
      advertising and ID-sync request, and companies reached within 1 s, 5 s and 30 s.
    columns:
      - name: visit_id
        tests: [not_null, unique]
  - name: mart_consent_timeline
    description: >
      For each second of the window (0-29): cumulative tracking requests and companies (median over sites)
      and the share of sites where tracking has started, by consent mode and site group plus 'All sites'.
  - name: mart_manual_sites
    description: >
      Bot-protected sites measured by hand (HAR import), per site and mode, with the group medians of the main
      dataset for orientation. Different procedure: shown separately, not pooled.
  - name: mart_promise_vs_reality
    description: >
      Per site: partners the banner asks consent for (IAB TCF vendor consents after a verified "Accept all",
      plus Google Additional Consent vendors; and the number stated in the banner text) against the tracking
      companies observed after "Accept all".
    columns:
      - name: site
        tests: [not_null, unique]
  - name: mart_group_summary
    description: >
      Tracking load by category group (coarser categories for the dashboard). sites_boost counts sites added
      from the CrUX top 5,000 for under-represented categories; filter on site_sample_source in the site-level
      marts to compare with the top-1,000 sample only.
    columns:
      - name: category_group
        tests: [not_null, unique]
  - name: mart_category_summary
    description: Tracking load by site category (medians over sites).
  - name: mart_company_reach
    description: Reach and data volume per company, consent mode and tracking type.
  - name: mart_cmp_market
    description: Consent management platforms, pay-or-okay share and banner weight.
  - name: mart_pre_consent
    description: Tracking requests and tracker cookies before any interaction with the banner.
